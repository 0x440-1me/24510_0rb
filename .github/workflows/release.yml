name: Native tagged release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: native-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      release_tag: ${{ github.ref_name }}
    permissions:
      contents: read
  publish:
    needs: build
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: native-windows-x64-package
          path: ${{ runner.temp }}/orb-release
          digest-mismatch: error
      - name: Verify downloaded files and publish new release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ORB_RELEASE_TAG: ${{ github.ref_name }}
          ORB_EXPECTED_SHA: ${{ needs.build.outputs.source_sha }}
          ORB_EXPECTED_VERSION: ${{ needs.build.outputs.version }}
        run: |
          & ./scripts/publish-release.ps1 -ReleaseTag $env:ORB_RELEASE_TAG -ExpectedSourceSha $env:ORB_EXPECTED_SHA -ExpectedVersion $env:ORB_EXPECTED_VERSION -ArtifactDirectory (Join-Path $env:RUNNER_TEMP 'orb-release')
